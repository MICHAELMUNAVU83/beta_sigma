<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A simple interview form for improving the BetaSigma project requirements."
    />
    <title>PRD Questions · BetaSigma</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #202421;
        --muted: #68706b;
        --line: #dfe3e0;
        --soft: #f5f6f5;
        --paper: #fff;
        --green: #245c4d;
        --green-soft: #eaf2ef;
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font:
          15px/1.5 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      select,
      summary,
      label {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(36, 92, 77, 0.18);
        outline-offset: 2px;
      }

      header {
        border-bottom: 1px solid var(--line);
      }

      .header-inner,
      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
      }

      .header-inner {
        min-height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        color: inherit;
        text-decoration: none;
        font-weight: 760;
      }

      .header-actions {
        display: flex;
        gap: 8px;
      }

      button,
      .button {
        min-height: 36px;
        padding: 7px 12px;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        text-decoration: none;
        font-weight: 650;
      }

      button:hover,
      .button:hover {
        background: var(--soft);
      }

      button.primary {
        color: #fff;
        background: var(--green);
        border-color: var(--green);
      }

      button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      main {
        padding: 42px 0 80px;
      }

      .scope-row {
        display: grid;
        grid-template-columns: auto minmax(220px, 1fr);
        gap: 12px;
        align-items: end;
        padding-bottom: 28px;
        border-bottom: 1px solid var(--line);
      }

      .scope-switch {
        display: flex;
        gap: 3px;
        padding: 3px;
        background: var(--soft);
        border-radius: 9px;
      }

      .scope-switch button {
        min-height: 34px;
        padding-inline: 13px;
        color: var(--muted);
        background: transparent;
        border: 0;
      }

      .scope-switch button.active {
        color: var(--ink);
        background: var(--paper);
        box-shadow: 0 1px 3px rgba(20, 30, 24, 0.12);
      }

      .select-label {
        display: block;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
      }

      select,
      input[type="text"],
      input[type="date"],
      input[type="number"],
      textarea {
        width: 100%;
        min-height: 40px;
        padding: 8px 10px;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid #cdd3cf;
        border-radius: 7px;
      }

      .select-label select {
        margin-top: 5px;
      }

      .intro {
        padding: 34px 0 22px;
      }

      .kicker {
        margin: 0 0 6px;
        color: var(--green);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 2.7rem);
        line-height: 1.12;
        letter-spacing: -0.04em;
      }

      .intro > p:last-of-type {
        max-width: 680px;
        margin: 10px 0 18px;
        color: var(--muted);
      }

      .session {
        display: grid;
        grid-template-columns: 1.4fr 0.7fr;
        gap: 10px;
        max-width: 680px;
      }

      .module-tabs {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding: 0 0 18px;
        scrollbar-width: thin;
      }

      .module-tab {
        flex: 0 0 auto;
        color: var(--muted);
        white-space: nowrap;
      }

      .module-tab.active {
        color: var(--green);
        background: var(--green-soft);
        border-color: #c7dcd4;
      }

      .module-head {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: start;
        padding: 22px 0 16px;
        border-top: 1px solid var(--line);
      }

      h2 {
        margin: 0;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }

      .module-head p {
        max-width: 650px;
        margin: 5px 0 0;
        color: var(--muted);
      }

      .progress {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 0.8rem;
        white-space: nowrap;
      }

      .progress strong {
        color: var(--ink);
      }

      .questions {
        border-top: 1px solid var(--line);
      }

      .question {
        display: grid;
        grid-template-columns: minmax(220px, 0.9fr) minmax(280px, 1.1fr);
        gap: 32px;
        padding: 22px 0;
        border-bottom: 1px solid var(--line);
      }

      .question-title {
        display: flex;
        gap: 9px;
      }

      .number {
        flex: 0 0 auto;
        color: #9aa19d;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .question h3 {
        margin: 0;
        font-size: 0.96rem;
        line-height: 1.42;
      }

      .hint {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .choices {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }

      .choice {
        min-height: 38px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 9px;
        color: #414743;
        background: var(--paper);
        border: 1px solid #d8ddda;
        border-radius: 7px;
        font-size: 0.84rem;
      }

      .choice:hover {
        background: var(--soft);
      }

      .choice:has(input:checked) {
        color: #17483b;
        background: var(--green-soft);
        border-color: #b9d3c9;
      }

      .choice input {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: var(--green);
      }

      .control > select,
      .control > input {
        max-width: 420px;
      }

      details {
        margin-top: 9px;
      }

      summary {
        width: max-content;
        color: var(--muted);
        font-size: 0.76rem;
        user-select: none;
      }

      summary:hover {
        color: var(--ink);
      }

      details textarea {
        min-height: 78px;
        margin-top: 8px;
        resize: vertical;
        font-size: 0.84rem;
      }

      .module-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 24px;
      }

      .saved {
        min-height: 20px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.75rem;
        text-align: right;
      }

      dialog {
        width: min(720px, calc(100% - 24px));
        max-height: calc(100vh - 30px);
        padding: 0;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 24px 70px rgba(20, 30, 24, 0.2);
      }

      dialog::backdrop {
        background: rgba(25, 30, 27, 0.4);
      }

      .dialog-head,
      .dialog-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 16px;
      }

      .dialog-head {
        border-bottom: 1px solid var(--line);
      }

      .dialog-foot {
        border-top: 1px solid var(--line);
      }

      .dialog-head h2 {
        font-size: 1rem;
      }

      .dialog-body {
        padding: 16px;
      }

      .export-choice {
        display: flex;
        gap: 18px;
        margin-bottom: 12px;
        font-size: 0.84rem;
      }

      .export-text {
        min-height: 430px;
        max-height: 60vh;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.75rem;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        padding: 9px 12px;
        color: #fff;
        background: #26302b;
        border-radius: 7px;
        font-size: 0.8rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 150ms ease;
      }

      .toast.show {
        opacity: 1;
      }

      @media (max-width: 700px) {
        .header-inner,
        main {
          width: min(100% - 24px, 920px);
        }

        .header-actions .docs-link {
          display: none;
        }

        main {
          padding-top: 24px;
        }

        .scope-row,
        .session,
        .question {
          grid-template-columns: 1fr;
        }

        .question {
          gap: 13px;
        }

        .choices {
          grid-template-columns: 1fr;
        }
      }

      @media print {
        header,
        .scope-row,
        .module-tabs,
        .module-actions,
        .saved,
        details:not([open]) {
          display: none;
        }

        main {
          padding: 0;
        }

        .question {
          break-inside: avoid;
        }
      }
    </style>
    <style>
      /* Focus mode: one question at a time. */
      body {
        background: #fbfbf9;
      }

      header {

      }

      .header-inner,

      }

        min-height: calc(100vh - 51px);
        padding-top: 26px;
      }

      .scope-row {
        grid-template-columns: auto minmax(220px, 360px);
        justify-content: space-between;
        padding-bottom: 20px;
      }

      .intro {
        padding: 22px 0 26px;
      }

        font-size: clamp(2rem, 5vw, 3.25rem);
      }

      .intro > p:last-of-type {
        max-width: 620px;

        max-width: 100%;
        margin-top: 18px;
      }

        font-size: 0.78rem;
      }

        margin-bottom: 14px;
      }

      .session {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: 16px;
        background: #fff;
        border: 1px solid #e5e5e2;
      }

      #financeOverview,
      #moduleTabs {
        display: none !important;
      }

      .focus {
        padding-top: 10px;
      }

      .focus-meta {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        color: #737373;
        font-size: 0.78rem;
      }

      .focus-track {
        height: 3px;
        overflow: hidden;
        margin: 12px 0 42px;
        background: #e8e8e5;
      }

      .focus-bar {
        height: 100%;
        background: #1d1d1b;
        transition: width 180ms ease;
      }

      .focus .module-head {
        display: none;
      }

      .focus .module-head h2 {
        color: #737373;
        font-size: 0.78rem;
        font-weight: 500;
      }

      .focus .module-head p {
        display: none;
      }

      .focus .questions {
        border: 0;
      }

      .focus .question {
        display: block;
        padding: 10px 0 0;
        border: 0;
      }

      .focus .question-title {
        display: block;
      }

      .focus .number {
        display: none;
      }

      .focus .question h3 {
        max-width: 760px;
        margin-bottom: 8px;
        font-size: clamp(1.55rem, 4vw, 2.35rem);
        line-height: 1.2;
        letter-spacing: -0.035em;
      }

      .focus .hint {
        max-width: 620px;
        margin-bottom: 26px;
        font-size: 0.9rem;
      }

      .focus .control > select,
      .focus .control > input {
        min-height: 48px;
        max-width: 520px;
        padding: 10px 12px;
        background: #fff;
        font-size: 0.95rem;
      }

      .focus .choices {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        max-width: 760px;
      }

      .focus .choice {
        min-height: 50px;
        padding: 11px 13px;
        background: #fff;
        border: 1px solid #dededb;
        border-radius: 6px;
        font-size: 0.92rem;
      }

      .focus .choice:hover {
        background: #f6f6f3;
        border: 1px solid #bdbdb8;
      }

      .focus .choice:has(input:checked) {
        color: #111;
        background: #f0f0ec;
        border: 1px solid #4b4b47;
      }

      .focus details {
        margin-top: 20px;
      }

      .focus .detail-fields {
        max-width: 760px;
      }

      .focus-actions {
        max-width: 760px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 42px 0 20px;
      }

      .focus-actions .right {
        display: flex;
        gap: 8px;
      }

      .focus-actions button {
        min-width: 90px;
        min-height: 40px;
      }

      .focus-actions .next {
        color: #fff;
        background: #1d1d1b;
        border-color: #1d1d1b;
      }

      .focus-actions .next:hover {
        background: #333;
      }

      .saved {
        max-width: 760px;
      }

      @media (max-width: 700px) {
        .header-inner,
        main {
          width: min(100% - 28px, 900px);
        }

        .scope-row {
          grid-template-columns: 1fr;
        }

        .session {
          grid-template-columns: 1fr;
        }

        .focus-track {
          margin-bottom: 30px;
        }

        .focus .choices {
          grid-template-columns: 1fr;
        }
      }
    </style>

        background: #fff;
      }

      .detail-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 14px;
        margin-top: 9px;
        background: #fafafa;
        border: 1px solid #e8e8e8;
      }

      .detail-fields .full {
        grid-column: 1 / -1;
      }

      .detail-fields label {
        color: #737373;
        font-size: 0.7rem;
        font-weight: 500;
      }

      .detail-fields input,
      .detail-fields select,
      .detail-fields textarea {
        margin-top: 5px;
        font-size: 0.82rem;
      }

      .detail-fields textarea {
        width: 100%;
        resize: vertical;
      }

      .module-actions {
        margin-top: 28px;
      }

      .saved {
        color: #8a8a8a;
      }

      dialog {
        border-radius: 4px;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.16);
      }

      .toast {
        color: #fff;
        background: #191919;
        border-radius: 3px;
      }

      @media (max-width: 700px) {
        .header-inner,
        main {
          width: min(100% - 28px, 1180px);
        }

        .scope-row {
          gap: 18px;
        }

        .session {
          grid-template-columns: 1fr;
        }

        .finance-overview-head {
          display: block;
        }

        .finance-flow {
          grid-template-columns: 1fr;
          gap: 5px;
        }

        .finance-arrow {
          transform: rotate(90deg);
          transform-origin: center;
        }

        .finance-module-progress {
          grid-template-columns: 1fr 1fr;
        }

        .question {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .choices {
          grid-template-columns: 1fr;
        }

        .detail-fields {
          grid-template-columns: 1fr;
        }

        .detail-fields .full {
          grid-column: auto;
        }
      }

      for (const scope of Object.values(data)) {
        for (const department of scope) {
          const [currentSystem, newSystem] = systemDiscoveryModules(department);
          department.modules = [

            newSystem,

      const storageKey = "betasigma-prd-simple-v1";
      const state = {
        schema: 3,
        scope: "group",
        department: "finance",
        module: "current-system",
        questionIndex: 0,
        answers: {},
        sessions: {},
      };

      const departmentSelect = document.getElementById("departmentSelect");
      const financeOverview = document.getElementById("financeOverview");
      const moduleTabs = document.getElementById("moduleTabs");
      const moduleContent = document.getElementById("moduleContent");
      const saveMessage = document.getElementById("saveMessage");
      const exportDialog = document.getElementById("exportDialog");
      const exportText = document.getElementById("exportText");

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey));
          if (!saved) return;
          state.answers = saved.answers || {};
          state.sessions = saved.sessions || {};
          if (data[saved.scope]) state.scope = saved.scope;
          const department =
            data[state.scope].find((item) => item.id === saved.department) ||
            data[state.scope][0];
          state.department = department.id;
          if (saved.schema !== state.schema) {
            state.module = department.modules[0].id;
            state.questionIndex = 0;
            return;
          }
          state.module =
            department.modules.find((item) => item.id === saved.module)?.id ||
            department.modules[0].id;
          const module = department.modules.find(
            (item) => item.id === state.module,
          );
          state.questionIndex = Math.min(
            Math.max(Number(saved.questionIndex) || 0, 0),
            module.questions.length - 1,
          );
        } catch (_error) {
          showToast("This browser cannot load saved answers.");
        }
      }

      function save() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(state));
          saveMessage.textContent = "Saved on this device";
          clearTimeout(save.timer);
          save.timer = setTimeout(() => (saveMessage.textContent = ""), 1400);
        } catch (_error) {
          saveMessage.textContent =
            "Could not save. Please export your answers.";
        }
      }

      function currentDepartment() {
        return data[state.scope].find((item) => item.id === state.department);
      }

      function currentModule() {
        return currentDepartment().modules.find(
          (item) => item.id === state.module,
        );
      }

      function allQuestions(department = currentDepartment()) {
        return department.modules.flatMap((module) =>
          module.questions.map((question, questionIndex) => ({
            module,
            question,
            questionIndex,
          })),
        );
      }

      function answerKey(departmentId, questionId) {
        return `${departmentId}::${questionId}`;
      }

      function answer(departmentId, questionId) {
        return (
          state.answers[answerKey(departmentId, questionId)] || {
            value: "",
            note: "",
          }
        );
      }

      function hasAnswer(item) {
        return Array.isArray(item.value)
          ? item.value.length > 0
          : String(item.value).trim() !== "";
      }

      function moduleProgress(department, module) {
        const done = module.questions.filter((question) =>
          hasAnswer(answer(department.id, question.id)),
        ).length;
        return { done, total: module.questions.length };
      }

      function render() {
        document.querySelectorAll("[data-scope]").forEach((button) => {
          button.classList.toggle(
            "active",
            button.dataset.scope === state.scope,
          );
        });

        departmentSelect.innerHTML = data[state.scope]
          .map(
            (department) =>
              `<option value="${department.id}" ${
                department.id === state.department ? "selected" : ""
              }>${escapeHtml(department.name)}</option>`,
          )
          .join("");

        const department = currentDepartment();
        const session = state.sessions[department.id] || {};
        document.getElementById("scopeName").textContent =
          state.scope === "group"
            ? "Group-level questions"
            : "Company questions";
        document.getElementById("departmentName").textContent = department.name;
        document.getElementById("departmentSummary").textContent =
          department.summary;
        document.getElementById("interviewee").value =
          session.interviewee || "";
        document.getElementById("interviewRole").value = session.role || "";
        document.getElementById("interviewer").value =
          session.interviewer || "";
        document.getElementById("sessionDate").value = session.date || "";

        renderFinanceOverview(department);
        moduleTabs.hidden =
          state.scope === "group" && department.id === "finance";

        moduleTabs.innerHTML = department.modules
          .map((module, index) => {
            const progress = moduleProgress(department, module);
            return `<button
              class="module-tab ${module.id === state.module ? "active" : ""}"
              type="button"
              data-module="${module.id}"
            >${index + 1}. ${escapeHtml(module.name)} · ${progress.done}/${
              progress.total
            }</button>`;
          })
          .join("");

        renderModule();
      }

      function renderFinanceOverview(department) {
        if (state.scope !== "group" || department.id !== "finance") {
          financeOverview.innerHTML = "";
          return;
        }

        const steps = [
          ["Request", "Staff asks to spend"],
          ["Approve", "The right person agrees"],
          ["Pay", "Finance sends money"],
          ["Receipt", "Proof is returned"],
          ["Check", "Finance closes the item"],
          ["Account", "It reaches the books"],
        ];

        financeOverview.innerHTML = `
          <div class="finance-overview">
            <div class="finance-overview-head">
              <h2>How the money moves</h2>
              <span>The questions below define each hand-off.</span>
            </div>
            <div class="finance-flow" aria-label="Finance workflow">
              ${steps
                .map(
                  (step, index) => `
                    <div class="finance-step">
                      <strong>${step[0]}</strong>
                      <span>${step[1]}</span>
                    </div>
                    ${
                      index < steps.length - 1
                        ? '<span class="finance-arrow" aria-hidden="true">→</span>'
                        : ""
                    }
                  `,
                )
                .join("")}
            </div>
            <div class="finance-module-progress" aria-label="Finance sections">
              ${department.modules
                .map((module, index) => {
                  const progress = moduleProgress(department, module);
                  return `
                    <button
                      class="${module.id === state.module ? "active" : ""}"
                      type="button"
                      data-finance-module="${module.id}"
                    >
                      <span>${index + 1}. ${escapeHtml(module.name)}</span>
                      <small>${progress.done}/${progress.total}</small>
                    </button>
                  `;
                })
                .join("")}
            </div>
          </div>
        `;
      }

      function renderModule() {
        const department = currentDepartment();
        const module = currentModule();
        state.questionIndex = Math.min(
          Math.max(state.questionIndex || 0, 0),
          module.questions.length - 1,
        );
        const question = module.questions[state.questionIndex];
        const questions = allQuestions(department);
        const globalIndex = questions.findIndex(
          (item) =>
            item.module.id === module.id &&
            item.questionIndex === state.questionIndex,
        );
        const sectionProgress = moduleProgress(department, module);
        const percentage = Math.round(
          ((state.questionIndex + 1) / module.questions.length) * 100,
        );

        moduleContent.innerHTML = `
          <div class="focus">
            <div class="focus-meta">
              <span>${escapeHtml(module.name)}</span>
              <span id="focusAnswered">${sectionProgress.done} answered · ${
                state.questionIndex + 1
              } of ${module.questions.length}</span>
            </div>
            <div class="focus-track" aria-hidden="true">
              <div class="focus-bar" id="focusBar" style="width:${percentage}%"></div>
            </div>
            <div class="module-head">
              <h2>${escapeHtml(module.name)}</h2>
              <p>${escapeHtml(module.intro)}</p>
            </div>
            <div class="questions">
              ${renderQuestion(department, question, state.questionIndex)}
            </div>
            <div class="focus-actions">
              <button type="button" data-question-move="-1" ${
                globalIndex === 0 ? "disabled" : ""
              }>Back</button>
              <div class="right">
                <button type="button" data-question-move="1">Skip</button>
                <button class="next" type="button" data-question-move="1">
                  ${globalIndex === questions.length - 1 ? "Finish" : "Next"}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      function renderQuestion(department, question, index) {
        const saved = answer(department.id, question.id);
        const hasDetails = [
          "note",
          "owner",
          "confidence",
          "priority",
          "evidence",
          "applies",
          "followUp",
        ].some((field) => {
          const value = saved[field];
          return Array.isArray(value)
            ? value.length
            : String(value || "").trim();
        });
        return `
          <article class="question">
            <div class="question-title">
              <span class="number">${index + 1}</span>
              <div>
                <h3>${escapeHtml(question.label)}</h3>
                ${
                  question.hint
                    ? `<p class="hint">${escapeHtml(question.hint)}</p>`
                    : ""
                }
              </div>
            </div>
            <div class="control">
              ${renderControl(question, saved)}
              <details ${hasDetails ? "open" : ""}>
                <summary>Add context</summary>
                <div class="detail-fields">
                  <label class="full">
                    Notes or examples
                    <textarea
                      data-meta-question="${question.id}"
                      data-meta-field="note"
                      placeholder="Rules, exceptions, examples, amounts, or names"
                    >${escapeHtml(saved.note || "")}</textarea>
                  </label>
                  <label>
                    Answer status
                    <select
                      data-meta-question="${question.id}"
                      data-meta-field="confidence"
                    >
                      ${[
                        "",
                        "Confirmed",
                        "Needs follow-up",
                        "Working assumption",
                        "Not discussed",
                      ]
                        .map(
                          (option) =>
                            `<option value="${option}" ${
                              saved.confidence === option ? "selected" : ""
                            }>${option || "Choose…"}</option>`,
                        )
                        .join("")}
                    </select>
                  </label>
                  <label>
                    Build priority
                    <select
                      data-meta-question="${question.id}"
                      data-meta-field="priority"
                    >
                      ${[
                        "",
                        "Must have at launch",
                        "Should have",
                        "Later",
                        "Not needed",
                      ]
                        .map(
                          (option) =>
                            `<option value="${option}" ${
                              saved.priority === option ? "selected" : ""
                            }>${option || "Choose…"}</option>`,
                        )
                        .join("")}
                    </select>
                  </label>
                  <label>
                    Owner
                    <input
                      type="text"
                      data-meta-question="${question.id}"
                      data-meta-field="owner"
                      value="${escapeHtml(saved.owner || "")}"
                      placeholder="Person, role, or team"
                    />
                  </label>
                  ${
                    state.scope === "group"
                      ? `
                        <label>
                          Applies to
                          <select
                            data-meta-question="${question.id}"
                            data-meta-field="applies"
                          >
                            ${[
                              "",
                              "Whole group",
                              "Sichangi Law Alliance",
                              "Tukutane",
                              "Chasing Sun",
                              "Different by company",
                              "Not confirmed",
                            ]
                              .map(
                                (option) =>
                                  `<option value="${option}" ${
                                    saved.applies === option ? "selected" : ""
                                  }>${option || "Choose…"}</option>`,
                              )
                              .join("")}
                          </select>
                        </label>
                      `
                      : ""
                  }
                  <label>
                    Follow-up date
                    <input
                      type="date"
                      data-meta-question="${question.id}"
                      data-meta-field="followUp"
                      value="${escapeHtml(saved.followUp || "")}"
                    />
                  </label>
                  <label class="full">
                    Evidence or source
                    <input
                      type="text"
                      data-meta-question="${question.id}"
                      data-meta-field="evidence"
                      value="${escapeHtml(saved.evidence || "")}"
                      placeholder="Policy, spreadsheet, report, system, or person to verify with"
                    />
                  </label>
                </div>
              </details>
            </div>
          </article>
        `;
      }

      function renderControl(question, saved) {
        if (question.type === "select") {
          return `<select data-answer="${question.id}" aria-label="${escapeHtml(
            question.label,
          )}">
            <option value="">Choose one…</option>
            ${question.options
              .map(
                (option) =>
                  `<option value="${escapeHtml(option)}" ${
                    saved.value === option ? "selected" : ""
                  }>${escapeHtml(option)}</option>`,
              )
              .join("")}
          </select>`;
        }

        if (question.type === "text" || question.type === "number") {
          return `<input
            type="${question.type}"
            data-answer="${question.id}"
            value="${escapeHtml(saved.value)}"
            placeholder="${escapeHtml(question.placeholder)}"
            aria-label="${escapeHtml(question.label)}"
            ${question.type === "number" ? 'min="0"' : ""}
          />`;
        }

        const selected = Array.isArray(saved.value)
          ? saved.value
          : saved.value
            ? [saved.value]
            : [];
        const inputType = question.type === "radio" ? "radio" : "checkbox";
        return `<div class="choices">
          ${question.options
            .map(
              (option, optionIndex) => `
                <label class="choice">
                  <input
                    type="${inputType}"
                    name="${question.type === "radio" ? question.id : `${question.id}-${optionIndex}`}"
                    value="${escapeHtml(option)}"
                    data-answer="${question.id}"
                    ${selected.includes(option) ? "checked" : ""}
                  />
                  <span>${escapeHtml(option)}</span>
                </label>
              `,
            )
            .join("")}
        </div>`;
      }

      function updateAnswer(questionId, value, field = "value") {
        const key = answerKey(state.department, questionId);
        state.answers[key] = {
          ...answer(state.department, questionId),
          [field]: value,
        };
        save();
        renderTabsAndProgress();
      }

      function renderTabsAndProgress() {
        const department = currentDepartment();
        const module = currentModule();
        const progress = moduleProgress(department, module);
        const answeredLabel = document.getElementById("focusAnswered");
        if (answeredLabel) {
          answeredLabel.textContent = `${progress.done} answered · ${
            state.questionIndex + 1
          } of ${module.questions.length}`;
        }
        const tab = moduleTabs.querySelector(`[data-module="${module.id}"]`);
        if (tab) {
          const index = department.modules.indexOf(module);
          tab.textContent = `${index + 1}. ${module.name} · ${progress.done}/${progress.total}`;
        }
        renderFinanceOverview(department);
      }

      function chooseScope(scope) {
        state.scope = scope;
        state.department = data[scope][0].id;
        state.module = data[scope][0].modules[0].id;
        state.questionIndex = 0;
        save();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function makeMarkdown(departments) {
        const lines = [
          "# PRD interview answers",
          "",
          `Exported: ${new Date().toLocaleString()}`,
          "",
        ];

        departments.forEach((department) => {
          const session = state.sessions[department.id] || {};
          lines.push(`## ${department.name}`, "");
          if (session.interviewee) {
            lines.push(`**Spoke to:** ${session.interviewee}`);
          }
          if (session.role) lines.push(`**Role:** ${session.role}`);
          if (session.interviewer) {
            lines.push(`**Interviewed by:** ${session.interviewer}`);
          }
          if (session.date) lines.push(`**Date:** ${session.date}`);
          if (
            session.interviewee ||
            session.role ||
            session.interviewer ||
            session.date
          ) {
            lines.push("");
          }

          department.modules.forEach((module) => {
            lines.push(`### ${module.name}`, "");
            module.questions.forEach((question) => {
              const saved = answer(department.id, question.id);
              const value = Array.isArray(saved.value)
                ? saved.value.join(", ")
                : saved.value;
              lines.push(
                `- **${question.label}** ${value || "_Not answered_"}`,
              );
              if (saved.note) lines.push(`  - Note: ${saved.note}`);
              if (saved.confidence) {
                lines.push(`  - Status: ${saved.confidence}`);
              }
              if (saved.priority) {
                lines.push(`  - Build priority: ${saved.priority}`);
              }
              if (saved.owner) lines.push(`  - Owner: ${saved.owner}`);
              if (saved.applies) lines.push(`  - Applies to: ${saved.applies}`);
              if (saved.evidence) lines.push(`  - Evidence: ${saved.evidence}`);
              if (saved.followUp) {
                lines.push(`  - Follow-up date: ${saved.followUp}`);
              }
            });
            lines.push("");
          });
        });
        return lines.join("\n");
      }

      function refreshExport() {
        const mode = document.querySelector(
          'input[name="exportScope"]:checked',
        ).value;
        const departments =
          mode === "current"
            ? [currentDepartment()]
            : [...data.group, ...data.company];
        exportText.value = makeMarkdown(departments);
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(
          () => toast.classList.remove("show"),
          1800,
        );
      }

      document.querySelectorAll("[data-scope]").forEach((button) => {
        button.addEventListener("click", () =>
          chooseScope(button.dataset.scope),
        );
      });

      departmentSelect.addEventListener("change", () => {
        state.department = departmentSelect.value;
        state.module = currentDepartment().modules[0].id;
        state.questionIndex = 0;
        save();
        render();
      });

      moduleTabs.addEventListener("click", (event) => {
        const button = event.target.closest("[data-module]");
        if (!button) return;
        state.module = button.dataset.module;
        state.questionIndex = 0;
        save();
        render();
        moduleContent.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      financeOverview.addEventListener("click", (event) => {
        const button = event.target.closest("[data-finance-module]");
        if (!button) return;
        state.module = button.dataset.financeModule;
        state.questionIndex = 0;
        save();
        render();
        moduleContent.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      moduleContent.addEventListener("change", (event) => {
        const target = event.target;
        if (target.matches("[data-meta-question]")) {
          updateAnswer(
            target.dataset.metaQuestion,
            target.value,
            target.dataset.metaField,
          );
          return;
        }
        if (!target.matches("[data-answer]")) return;
        const questionId = target.dataset.answer;
        if (target.type === "checkbox") {
          const checked = [
            ...moduleContent.querySelectorAll(
              `input[type="checkbox"][data-answer="${questionId}"]:checked`,
            ),
          ].map((input) => input.value);
          updateAnswer(questionId, checked);
        } else {
          updateAnswer(questionId, target.value);
        }
      });

      moduleContent.addEventListener("input", (event) => {
        const target = event.target;
        if (
          target.matches(
            'input[data-answer][type="text"], input[data-answer][type="number"]',
          )
        ) {
          updateAnswer(target.dataset.answer, target.value);
        }
        if (
          target.matches(
            'textarea[data-meta-question], input[data-meta-question][type="text"]',
          )
        ) {
          updateAnswer(
            target.dataset.metaQuestion,
            target.value,
            target.dataset.metaField,
          );
        }
      });

      moduleContent.addEventListener("click", (event) => {
        const button = event.target.closest("[data-question-move]");
        if (!button || button.disabled) return;
        const department = currentDepartment();
        const questions = allQuestions(department);
        const currentIndex = questions.findIndex(
          (item) =>
            item.module.id === state.module &&
            item.questionIndex === state.questionIndex,
        );
        const nextIndex = currentIndex + Number(button.dataset.questionMove);
        if (nextIndex >= questions.length) {
          refreshExport();
          exportDialog.showModal();
          return;
        }
        if (nextIndex < 0) return;
        state.module = questions[nextIndex].module.id;
        state.questionIndex = questions[nextIndex].questionIndex;
        save();
        render();
        moduleContent.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      const sessionFields = {
        interviewee: "interviewee",
        interviewRole: "role",
        interviewer: "interviewer",
        sessionDate: "date",
      };
      Object.keys(sessionFields).forEach((id) => {
        document.getElementById(id).addEventListener("input", (event) => {
          state.sessions[state.department] ||= {};
          state.sessions[state.department][sessionFields[id]] =
            event.target.value;
          save();
        });
      });

      document.getElementById("exportButton").addEventListener("click", () => {
        refreshExport();
        exportDialog.showModal();
      });
      document
        .getElementById("closeExport")
        .addEventListener("click", () => exportDialog.close());
      document
        .querySelectorAll('input[name="exportScope"]')
        .forEach((radio) => {
          radio.addEventListener("change", refreshExport);
        });
      document
        .getElementById("copyExport")
        .addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(exportText.value);
          } catch (_error) {
            exportText.select();
            document.execCommand("copy");
          }
          showToast("Copied");
        });
      document
        .getElementById("downloadExport")
        .addEventListener("click", () => {
          const blob = new Blob([exportText.value], {
            type: "text/markdown;charset=utf-8",
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "prd-interview-answers.md";
          link.click();
          URL.revokeObjectURL(url);
          showToast("Downloaded");
        });

      load();
      render();
    </script>
  </body>
</html>
